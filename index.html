<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Phần Mềm Quản Lý Giáo Lý</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Thay liên kết /exec của Google Apps Script vào thuộc tính src dưới đây -->
  <iframe 
    src="ĐƯỜNG_DẪN_WEB_APP_GAS_CỦA_BẠN" 
    allow="camera; microphone; geolocation" 
    allowfullscreen>
  </iframe>
</body>
</html>
